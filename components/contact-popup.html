<div class="popup-overlay js-popup-overlay">
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <button class="popup__close js-popup-close" type="button" aria-label="Close" data-cursor="button">
      <i data-lucide="x" aria-hidden="true"></i>
    </button>

    <h3 class="popup__title" id="popup-title">Let's talk</h3>
    <p class="popup__subtitle">
      Tell me a little about the project or the role, and I'll reply within a day or two.
    </p>

    <form class="js-contact-form" novalidate>
      <div class="form-field">
        <label for="popup-name">Name</label>
        <input type="text" id="popup-name" name="name" required autocomplete="name" />
      </div>
      <div class="form-field">
        <label for="popup-email">Email</label>
        <input type="email" id="popup-email" name="email" required autocomplete="email" />
      </div>
      <div class="form-field">
        <label for="popup-company">Company</label>
        <input type="text" id="popup-company" name="company" autocomplete="organization" />
      </div>
      <div class="form-field">
        <label for="popup-message">Message</label>
        <textarea id="popup-message" name="message" required></textarea>
      </div>

      <div class="popup__actions">
        <button type="submit" class="btn btn--primary" data-cursor="button">Send Message</button>
        <a
          href="assets/resume/Gufran_Ansari_Resume.pdf"
          download
          class="btn btn--secondary"
          data-cursor="button"
        >
          Download Resume
        </a>
      </div>

      <p class="form-status js-form-status" role="status"></p>
    </form>
  </div>
</div>
